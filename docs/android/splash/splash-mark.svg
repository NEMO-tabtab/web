<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
<!-- Android 로딩 이미지 원본 (#149). 300dp 캔버스 가운데에 캐릭터 폭 96dp — 웹 로딩 화면(src/app/components/LaunchSplash.tsx)과 같은 그림·같은 크기다.
     캐릭터는 앱 아이콘(public/images/app-icon-maskable.svg)과 같다. 캐릭터 경계(x 17.5~82.5, y 16.5~86.5)를 96/65 배로 키워 가운데에 둔다. -->
<defs><filter id="rough" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
